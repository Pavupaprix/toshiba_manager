services:
  app:
    build: .
    # Publié sur toutes les interfaces de l'hôte pour rester joignable
    # depuis un reverse proxy tiers sur le même LAN (ex. Nginx Proxy
    # Manager, Cloudflare Tunnel en conteneur séparé...), pas seulement en
    # loopback. Reste limité au réseau local — ne PAS rediriger ce port
    # directement depuis Internet : passe par un reverse proxy qui exige
    # une authentification avant l'app (FR-011). Le service `proxy`
    # ci-dessous (profil `public`) en est un exemple intégré ; si tu utilises
    # ton propre reverse proxy (NPM, etc.), pense à protéger l'accès de son
    # côté (ex. Access List NPM, Cloudflare Access...).
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
    volumes:
      - toshiba_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5000/healthz').status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Reverse proxy HTTPS + authentification — M2 uniquement (FR-010 à FR-012)
  # Démarrer avec : docker compose --profile public up
  proxy:
    image: caddy:2-alpine
    profiles: ["public"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    restart: unless-stopped

volumes:
  toshiba_data:
  caddy_data:
  caddy_config:
